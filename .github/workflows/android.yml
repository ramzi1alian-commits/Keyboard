name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build APK and Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Static security audit
        run: |
          chmod +x scripts/security_audit.sh
          bash scripts/security_audit.sh

      - name: Android security hardening audit
        if: ${{ hashFiles('scripts/security_hardening_audit.sh') != '' }}
        run: |
          chmod +x scripts/security_hardening_audit.sh
          bash scripts/security_hardening_audit.sh

      - name: Crypto key management audit
        if: ${{ hashFiles('scripts/crypto_key_management_audit.sh') != '' }}
        run: |
          chmod +x scripts/crypto_key_management_audit.sh
          bash scripts/crypto_key_management_audit.sh

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            security-report.txt
            security-report.json
            build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14


  adversarial-tests:
    name: Adversarial Crypto Tests (Android Emulator)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;default;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run adversarial instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: test
          force-avd-creation: false
          cores: 2
          emulator-port: 5554
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot
            -no-metrics
          disable-animations: true
          disable-spellchecker: false
          disable-linux-hw-accel: true
          enable-hw-keyboard: false
          channel: stable
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-test-reports
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14

// Supply-chain hardening: restrict which repositories may resolve which
// dependency groups, and reject any repository declared elsewhere (e.g. a
// module accidentally/maliciously adding a third-party Maven host). This
// closes the "dependency confusion" class of attack, where a malicious
// package with the same coordinates is published to an unvetted repository
// and resolved instead of the real one.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroupByRegex "com\\.android.*"
                includeGroupByRegex "androidx\\..*"
                includeGroupByRegex "com\\.google\\.android.*"
            }
        }
        mavenCentral {
            content {
                includeGroup "org.jetbrains.kotlin"
                includeGroup "org.jetbrains.kotlin.jvm"
                includeGroupByRegex "org\\.jetbrains\\.kotlin.*"
                includeGroup "org.bouncycastle"
                includeGroup "com.google.zxing"
                includeGroup "com.journeyapps"
                includeGroupByRegex "org\\.junit.*"
                includeGroup "junit"
                includeGroup "org.robolectric"
                // FIXED (build failure): these three are not dependencies
                // this project declares directly - they are TRANSITIVE
                // dependencies pulled in underneath ones that ARE declared
                // (kotlin-stdlib pulls org.jetbrains:annotations; material
                // pulls com.google.errorprone:error_prone_annotations;
                // appcompat/core-ktx pull com.google.guava:listenablefuture
                // via profileinstaller/concurrent-futures). Content-filtered
                // repositories restrict resolution for EVERY group in the
                // whole dependency graph, not just the ones app/build.gradle
                // mentions by name - so every transitive group needs its own
                // entry here too, or resolution fails with "Could not find"
                // even though nothing about the declared dependencies
                // changed. If a future dependency bump pulls in still more
                // new transitive groups, expect the same failure shape again
                // ("Could not find <group>:<artifact>:<version> - Required
                // by: ...") and add that group here the same way.
                includeGroup "org.jetbrains"
                includeGroup "com.google.errorprone"
                includeGroup "com.google.guava"
                // Not yet reported by CI, but added proactively: junit:junit
                // depends on org.hamcrest:hamcrest-core, and this project's
                // debugRuntimeClasspath resolution (the one that just failed)
                // is a different configuration from the test classpaths that
                // pull in JUnit/Robolectric - so this exact same failure
                // shape is very likely to appear next, once the unit-tests
                // CI job resolves ITS classpath, if this isn't added now.
                includeGroup "org.hamcrest"
                // kotlinCompilerClasspath (the Kotlin compiler's OWN tooling
                // classpath - separate from anything app/build.gradle
                // declares) needs trove4j underneath kotlin-compiler-embeddable.
                includeGroup "org.jetbrains.intellij.deps"

                // NOT YET REPORTED BY CI - added from manual review, since
                // the test classpath (which pulls these in) has not been
                // exercised by CI yet at the time of writing (only the main
                // debugRuntimeClasspath and kotlinCompilerClasspath have
                // failed and been fixed so far). org.robolectric:robolectric
                // has a dependency tree that reaches well outside its own
                // group - these are its well-known transitive dependencies:
                // ASM (bytecode instrumentation for its sandbox/shadow
                // classloader), a legacy SQLite binding, a bundled TLS
                // provider, and a couple of small annotation-only jars.
                // Flagged here as "likely but not personally verified
                // against a real resolved dependency tree" - this
                // environment has no network access to actually run
                // `gradle :app:dependencies` and confirm the exact set, so
                // treat this list as a strong best-effort, not a guarantee.
                // If the unit-tests CI job still fails with "Could not
                // find <group>:<artifact>", the fix is the same as every
                // time before: read the group off the error and add it.
                includeGroup "org.ow2.asm"
                includeGroup "com.almworks.sqlite4java"
                includeGroup "org.conscrypt"
                includeGroup "javax.annotation"
                includeGroup "com.google.auto.value"
                includeGroup "com.google.auto.service"
            }
        }
    }
}

rootProject.name = "SecureKeyboard"
include ':app'

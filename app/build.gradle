plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.securekeyboard.app'
    compileSdk 34

    defaultConfig {
        // Changed from com.securekeyboard.app -> com.securekeyboard.pro so
        // this build installs as a SEPARATE app next to any older version
        // already on the device, instead of overwriting/removing it.
        // Android treats applicationId as the unique app identity; two
        // different IDs can be installed side by side even though the
        // internal Kotlin package (namespace, above) is unchanged.
        applicationId "com.securekeyboard.pro"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    signingConfigs {
        release {
            // Release signing is opt-in via environment variables / CI
            // secrets (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
            // RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). If they are not
            // set, this signingConfig is left incomplete on purpose:
            // Gradle will then produce an UNSIGNED release build rather
            // than silently falling back to a shared/public debug
            // keystore. Anyone doing a real (non-test) deployment must
            // supply their own private keystore. See README.md.
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Pure-Java Argon2id implementation (no native/.so binaries needed,
    // so it works on every Android ABI without extra NDK setup). Used to
    // replace PBKDF2: Argon2id costs real memory per guess, not just CPU
    // time, which makes GPU/ASIC brute-forcing far more expensive than
    // PBKDF2 at an equivalent "iteration count".
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // Intentionally NO networking libraries (no OkHttp, Retrofit, etc).
    // This app never requests android.permission.INTERNET in the manifest,
    // so the OS itself blocks any network access at install time -
    // no code-level promise is needed, it's enforced by the platform.
}
